name: Build and Publish to NuGet

# A version tag publishes: v1.2.3 publishes 1.2.3, rc-v1.2.3 publishes the pre-release
# 1.2.3-rc.<run number>. Both go through this one file, because the nuget.org trusted publishing
# policy names the workflow file: renaming or splitting it breaks publishing until the policy is updated.
on:
  push:
    tags:
      - 'v*'
      - 'rc-v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # lets the job request a GitHub OIDC token for NuGet trusted publishing

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The SDK comes from global.json; the 8.0 runtime is for the net8.0 test run.
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x

    - name: Version from tag
      id: version
      run: |
        case "$GITHUB_REF_NAME" in
          rc-v*) VERSION="${GITHUB_REF_NAME#rc-v}-rc.${{ github.run_number }}" ;;
          v*)    VERSION="${GITHUB_REF_NAME#v}" ;;
          *)     echo "Not a version tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
        esac
        echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Version: $VERSION"

    - name: Restore dependencies
      run: dotnet restore VnumEnumeration.slnx

    - name: Build solution
      run: dotnet build VnumEnumeration.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

    - name: Run tests
      run: dotnet test tests/VnumEnumeration.Tests/VnumEnumeration.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Pack NuGet package
      run: dotnet pack src/VnumEnumeration/VnumEnumeration.csproj --configuration Release --no-build --output ./nupkgs -p:Version=${{ steps.version.outputs.VERSION }}

    # Trusted publishing: exchanges the job's OIDC token for a NuGet API key that is valid for one hour.
    # nuget.org needs a trusted publishing policy that names this repository and this workflow file.
    - name: NuGet login (OIDC to temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}  # nuget.org profile name, not the email address

    # --skip-duplicate: a rerun after a failure past this step publishes nothing twice.
    - name: Push to NuGet.org
      run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
